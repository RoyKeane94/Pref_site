[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python manage.py hydrate_media && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
releaseCommand = "python manage.py migrate --noinput"
restartPolicyType = "ON_FAILURE"
